<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doc Scanner — Gemma 4 E4B</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        color: #1a1a1a;
        padding: 2rem 1rem;
      }
      .container {
        max-width: 760px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
      }

      .upload-zone {
        border: 1.5px dashed #ccc;
        border-radius: 12px;
        padding: 2.5rem;
        text-align: center;
        cursor: pointer;
        background: #fff;
        transition: border-color 0.2s;
        margin-bottom: 1rem;
      }
      .upload-zone:hover,
      .upload-zone.drag {
        border-color: #6366f1;
        background: #f0f0ff;
      }
      .upload-zone input {
        display: none;
      }
      .upload-zone p {
        color: #666;
        font-size: 14px;
        margin-top: 8px;
      }

      #fileName {
        display: none;
        margin: 0.75rem 0 0.25rem;
        font-size: 13px;
        font-weight: 600;
        color: #4b5563;
        background: #eef2ff;
        border: 1px solid #dbe4ff;
        border-radius: 999px;
        padding: 0.45rem 0.8rem;
        width: fit-content;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #preview {
        max-width: 100%;
        border-radius: 8px;
        margin: 1rem 0;
        display: none;
      }

      #pdfPreview {
        width: 100%;
        height: 560px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        margin: 1rem 0;
        display: none;
        background: #fff;
      }

      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .control-label {
        font-size: 11px;
        color: #666;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      select {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 14px;
        background: #fff;
      }
      button {
        padding: 8px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        background: #6366f1;
        color: #fff;
        transition: opacity 0.15s;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 560px) {
        .result-grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: #fff;
        border-radius: 12px;
        border: 0.5px solid #e0e0e0;
        padding: 1rem 1.25rem;
      }
      .card-label {
        font-size: 11px;
        font-weight: 500;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }
      .card-text {
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #eef;
        color: #5555cc;
        margin-left: 6px;
      }

      .key-fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .kf-row {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        gap: 12px;
      }
      .kf-key {
        color: #888;
        white-space: nowrap;
      }
      .kf-val {
        font-weight: 500;
        text-align: right;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #fff;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: middle;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #error {
        color: #c00;
        font-size: 13px;
        margin-top: 8px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Document scanner — Gemma 4 E4B</h1>

      <div class="upload-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*,.pdf" />
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#aaa"
          stroke-width="1.5"
        >
          <path
            d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"
          />
        </svg>
        <p>Drop an image or PDF here, or click to browse</p>
      </div>

      <div id="fileName"></div>
      <img id="preview" alt="Document preview" />
      <iframe id="pdfPreview" title="PDF preview"></iframe>

      <div class="controls">
        <div class="control-group">
          <span class="control-label">Target Language</span>
          <select id="targetLang">
            <option value="English">→ English</option>
            <option value="Hindi">→ Hindi</option>
            <option value="Spanish">→ Spanish</option>
            <option value="French">→ French</option>
            <option value="Arabic">→ Arabic</option>
            <option value="Japanese">→ Japanese</option>
            <option value="German">→ German</option>
            <option value="Portuguese">→ Portuguese</option>
          </select>
        </div>
        <div class="control-group">
          <span class="control-label">Gemma 4 Visual Budget</span>
          <select id="visualBudget">
            <option value="70">70 - Fastest, coarse detail</option>
            <option value="140">140 - Fast</option>
            <option value="280">280 - Balanced</option>
            <option value="560" selected>560 - High detail</option>
            <option value="1120">1120 - Maximum detail</option>
          </select>
        </div>
        <button id="scanBtn" disabled onclick="scan()">Scan document</button>
      </div>
      <div id="error"></div>

      <div id="results" style="display: none">
        <div
          style="margin-bottom: 8px; font-size: 13px; color: #666"
          id="meta"
        ></div>
        <div class="result-grid">
          <div class="card">
            <div class="card-label">Extracted text</div>
            <div class="card-text" id="origText"></div>
          </div>
          <div class="card">
            <div class="card-label">Translation</div>
            <div class="card-text" id="transText"></div>
          </div>
        </div>
        <div
          class="card"
          id="keyFieldsCard"
          style="margin-top: 12px; display: none"
        >
          <div class="card-label">Key fields detected</div>
          <div class="key-fields" id="keyFields"></div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px">
          <button
            onclick="copyText('origText')"
            style="background: #eef; color: #5555cc; border: 0.5px solid #ccd"
          >
            Copy original
          </button>
          <button
            onclick="copyText('transText')"
            style="background: #eef; color: #5555cc; border: 0.5px solid #ccd"
          >
            Copy translation
          </button>
        </div>
      </div>
    </div>

    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const fileName = document.getElementById("fileName");
      const preview = document.getElementById("preview");
      const pdfPreview = document.getElementById("pdfPreview");
      const scanBtn = document.getElementById("scanBtn");
      const visualBudget = document.getElementById("visualBudget");
      let selectedFile = null;
      let previewObjectUrl = null;
      let scanTimerId = null;
      let scanStartMs = null;

      dropZone.onclick = () => fileInput.click();
      fileInput.onchange = (e) => setFile(e.target.files[0]);

      dropZone.ondragover = (e) => {
        e.preventDefault();
        dropZone.classList.add("drag");
      };
      dropZone.ondragleave = () => dropZone.classList.remove("drag");
      dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag");
        setFile(e.dataTransfer.files[0]);
      };

      function setFile(f) {
        if (!f) return;
        const isImage = f.type.startsWith("image/");
        const isPdf =
          f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf");
        if (!isImage && !isPdf) {
          const el = document.getElementById("error");
          el.textContent = "Error: only image and PDF files are supported.";
          el.style.display = "block";
          return;
        }

        selectedFile = f;
        scanBtn.disabled = false;
        stopScanTimer(true);
        fileName.textContent = `Processing: ${f.name}`;
        fileName.style.display = "inline-flex";
        if (previewObjectUrl) {
          URL.revokeObjectURL(previewObjectUrl);
          previewObjectUrl = null;
        }

        preview.style.display = "none";
        pdfPreview.style.display = "none";

        previewObjectUrl = URL.createObjectURL(f);
        if (isImage) {
          preview.src = previewObjectUrl;
          preview.style.display = "block";
        } else if (isPdf) {
          pdfPreview.src = previewObjectUrl;
          pdfPreview.style.display = "block";
        }

        document.getElementById("results").style.display = "none";
        document.getElementById("error").style.display = "none";
      }

      function startScanTimer() {
        stopScanTimer(false);
        scanStartMs = Date.now();
        const tick = () => {
          if (!scanStartMs) return;
          const elapsedSeconds = Math.max(
            0,
            Math.floor((Date.now() - scanStartMs) / 1000),
          );
          fileName.textContent = `Elapsed: ${formatDuration(elapsedSeconds)} · Processing: ${selectedFile?.name || ""}`;
        };
        tick();
        scanTimerId = setInterval(tick, 1000);
      }

      function stopScanTimer(resetToFilename) {
        if (scanTimerId) {
          clearInterval(scanTimerId);
          scanTimerId = null;
        }
        scanStartMs = null;
        if (resetToFilename && selectedFile) {
          fileName.textContent = `Processing: ${selectedFile.name}`;
        }
      }

      function formatDuration(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      async function scan() {
        if (!selectedFile) return;
        const targetLang = document.getElementById("targetLang").value;
        const budget = visualBudget.value;
        scanBtn.disabled = true;
        scanBtn.innerHTML = '<span class="spinner"></span> Scanning…';
        document.getElementById("error").style.display = "none";
        startScanTimer();

        const fd = new FormData();
        fd.append("file", selectedFile);
        fd.append("target_lang", targetLang);
        fd.append("visual_budget", budget);

        try {
          const res = await fetch("http://192.168.0.100:8000/scan", {
            method: "POST",
            body: fd,
          });
          if (!res.ok) {
            let detail = `Server error ${res.status}`;
            try {
              const err = await res.json();
              if (err?.detail) detail = err.detail;
            } catch (_) {}
            throw new Error(detail);
          }
          const data = await res.json();

          document.getElementById("meta").textContent =
            `Detected: ${data.detected_language} (${data.script}) — confidence: ${data.confidence}`;
          document.getElementById("origText").textContent = data.original_text;
          document.getElementById("transText").textContent = data.translation;

          const kf = data.key_fields || {};
          const kfCard = document.getElementById("keyFieldsCard");
          const kfDiv = document.getElementById("keyFields");
          kfDiv.innerHTML = "";
          if (Object.keys(kf).length > 0) {
            Object.entries(kf).forEach(([k, v]) => {
              kfDiv.innerHTML += `<div class="kf-row"><span class="kf-key">${k}</span><span class="kf-val">${v}</span></div>`;
            });
            kfCard.style.display = "block";
          } else {
            kfCard.style.display = "none";
          }

          document.getElementById("results").style.display = "block";
        } catch (err) {
          const el = document.getElementById("error");
          el.textContent = `Error: ${err.message}`;
          if (/fetch/i.test(err.message)) {
            el.textContent +=
              ". Check that the FastAPI server is running and reachable on your network.";
          }
          el.style.display = "block";
        } finally {
          stopScanTimer(true);
          scanBtn.disabled = false;
          scanBtn.textContent = "Scan document";
        }
      }

      function copyText(id) {
        navigator.clipboard.writeText(document.getElementById(id).textContent);
      }
    </script>
  </body>
</html>
